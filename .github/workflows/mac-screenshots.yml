# Screenshots for docs/MAC.md: what a person sees installing the Mac app for the first
# time. Run by hand with the id of a ci run whose macos job built the .dmg. The pictures
# come back as the "mac-screenshots" artifact; good ones are copied into docs/images/mac/.
name: mac-screenshots
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ci run id whose deck-narrator-mac artifact (the .dmg) to use"
        required: true
      runner:
        description: "macOS runner image"
        default: macos-15

permissions:
  actions: read
  contents: write   # the pictures are also pushed to the ci-screenshots branch

jobs:
  shots:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deck-narrator-mac
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Take screenshots
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -x
          mkdir -p shots
          # Every command gets at most 40 s: a dialog waiting for a click must not stall the job.
          t() { perl -e 'alarm shift; exec @ARGV' 40 "$@"; }
          shot() { sleep "${2:-6}"; t screencapture -x "shots/$1.png" || true; }
          sw_vers
          spctl --status || true
          # Turn Gatekeeper on, as on a normal Mac (CI images may have it off).
          t sudo -n spctl --global-enable 2>/dev/null || t sudo -n spctl --master-enable 2>/dev/null || true
          spctl --status || true
          dmg=$(ls deck-narrator-*-mac-arm64.dmg)
          # Mark it as downloaded from the web, the way Safari or Chrome would.
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;" "$dmg"
          t open "$dmg"
          shot 1-disk-image 10
          t cp -R "/Volumes/Deck Narrator/Deck Narrator.app" /Applications/
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;" "/Applications/Deck Narrator.app"
          t open "/Applications/Deck Narrator.app" || true
          shot 2-first-open 10
          # Click Done on the warning (Esc doesn't close it); kill the dialog agent if that fails.
          t osascript -e 'tell application "System Events" to tell process "CoreServicesUIAgent" to click button "Done" of window 1' || \
            t killall CoreServicesUIAgent || true
          sleep 2
          t open "x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension" || \
            t open "x-apple.systempreferences:com.apple.preference.security"
          shot 3-privacy-security 8
          # Scroll the right-hand pane to the bottom, where "Open Anyway" is.
          # Try 1: move keyboard focus into the pane, then End / Page Down.
          t osascript -e 'tell application "System Events" to tell process "System Settings"
            key code 48
            delay 0.5
            key code 119
            repeat 8 times
              key code 121
            end repeat
          end tell' || true
          shot 4a-keys 3
          # Try 2: real mouse-wheel events over the pane.
          cat > scroll.swift <<'SW'
          import CoreGraphics
          import Foundation
          let p = CGPoint(x: 620, y: 450)
          CGEvent(mouseEventSource: nil, mouseType: .mouseMoved, mouseCursorPosition: p, mouseButton: .left)?.post(tap: .cghidEventTap)
          usleep(200000)
          for _ in 0..<60 {
            CGEvent(scrollWheelEvent2Source: nil, units: .line, wheelCount: 1, wheel1: -10, wheel2: 0, wheel3: 0)?.post(tap: .cghidEventTap)
            usleep(30000)
          }
          SW
          perl -e 'alarm shift; exec @ARGV' 150 swift scroll.swift || true
          shot 4b-wheel 3
          t osascript -e 'quit app "System Settings"' || true
          # The app itself, once allowed (close the disk-image window so it isn't in front).
          t osascript -e 'tell application "Finder" to close every window' || true
          xattr -dr com.apple.quarantine "/Applications/Deck Narrator.app"
          t open "/Applications/Deck Narrator.app" || true
          shot 5-app 20
          ls -l shots
      # Also on a throwaway branch, so they can be looked at without downloading the artifact.
      - name: Push to the ci-screenshots branch
        if: always()
        run: |
          [ -n "$(ls shots 2>/dev/null)" ] || exit 0
          cd shots
          git init -q -b ci-screenshots
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "mac screenshots from run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-screenshots
          path: shots
          if-no-files-found: warn
          retention-days: 14
