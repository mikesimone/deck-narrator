# Tests on Linux and Windows on every push. The Windows job also builds the standalone
# zip (PyInstaller, CPU torch) and tests the built .exe with the same suite, then builds
# the MSI installer (WiX, with the voice model bundled), installs it, runs the suite and
# the GUI against the installed copy with HuggingFace switched off, and uninstalls it.
# On a v* tag push, or a manual run with "release" ticked, both go on a GitHub release.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release for narrate.py's VERSION (creates the v<VERSION> tag at this commit)"
        type: boolean
        default: false

permissions:
  contents: write   # creating the release on tags

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-82m-v1
      - name: Setup (setup.sh)
        run: ./setup.sh
      - name: Test suite
        run: test/verify.sh --device cpu
      - name: GUI smoke test (virtual display)
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          xvfb-run -a .venv/bin/python gui.py --selftest builds test/anim-deck.pptx "$RUNNER_TEMP/gui.txt" 0
          cat "$RUNNER_TEMP/gui.txt"

  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~\.cache\huggingface
          key: hf-kokoro-82m-v1-win
      # LibreOffice comes from our own dependency script (direct download, minimal, Office
      # file types left alone), so every render below tests that install. ffmpeg (and
      # ffprobe, for the tests) from Chocolatey; setup.ps1 then skips its winget installs.
      - name: LibreOffice (install-dependencies.ps1)
        env:
          DECK_NARRATOR_NO_PAUSE: "1"
        run: |
          .\packaging\install-dependencies.ps1
          if ($LASTEXITCODE) { Get-Content "$env:TEMP\deck-narrator-libreoffice-install.log" -Tail 80 -ErrorAction SilentlyContinue; throw "install-dependencies.ps1 failed" }
          $dir = "$env:ProgramFiles\LibreOffice\program"
          if (-not (Test-Path "$dir\simpress.exe")) { throw "Impress missing" }
          $assoc = (Get-ItemProperty "Registry::HKEY_CLASSES_ROOT\.pptx" -ErrorAction SilentlyContinue).'(default)'
          Write-Host ".pptx is associated with: '$assoc'"
          if ($assoc -like "LibreOffice*") { throw "LibreOffice took over .pptx despite REGISTER_NO_MSO_TYPES=1" }
          if (Test-Path "$env:PUBLIC\Desktop\LibreOffice*.lnk") { throw "LibreOffice put an icon on the desktop" }
      - name: ffmpeg (for the tests)
        run: choco install ffmpeg -y --no-progress
      - name: Setup (setup.ps1)
        run: .\setup.ps1
      - name: Test suite (from source)
        run: .\.venv\Scripts\python.exe test\verify.py --device cpu
      - name: Build standalone (PyInstaller)
        run: |
          uv pip install --python .venv\Scripts\python.exe pyinstaller
          .\.venv\Scripts\pyinstaller.exe --noconfirm packaging\deck-narrator.spec
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md dist\deck-narrator\
          Copy-Item packaging\WINDOWS-STANDALONE.txt dist\deck-narrator\README-FIRST.txt
          Copy-Item -Recurse packaging\licenses dist\deck-narrator\licenses
          Copy-Item packaging\install-dependencies.ps1, packaging\install-dependencies.cmd dist\deck-narrator\
      # ffmpeg ships inside the app (dist\deck-narrator\ffmpeg), so users never install it.
      # gyan.dev's release "essentials" build: GPL-3.0, with libx264 for the H.264 encode.
      - name: Bundle ffmpeg
        run: |
          curl.exe -L --fail --retry 3 -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          if ($LASTEXITCODE) { throw "ffmpeg download failed" }
          Expand-Archive ffmpeg.zip ffmpeg-unpacked
          $src = (Get-ChildItem ffmpeg-unpacked -Directory)[0].FullName
          New-Item -ItemType Directory dist\deck-narrator\ffmpeg | Out-Null
          Copy-Item "$src\bin\ffmpeg.exe", "$src\LICENSE" dist\deck-narrator\ffmpeg\
          Copy-Item "$src\README.txt" dist\deck-narrator\ffmpeg\README.txt -ErrorAction SilentlyContinue
          $v = & dist\deck-narrator\ffmpeg\ffmpeg.exe -hide_banner -version | Select-Object -First 1
          Write-Host $v
          if (-not ((& dist\deck-narrator\ffmpeg\ffmpeg.exe -hide_banner -encoders) -match "libx264")) { throw "bundled ffmpeg has no libx264" }
      - name: Test suite (standalone .exe)
        run: .\.venv\Scripts\python.exe test\verify.py --exe dist\deck-narrator\deck-narrator.exe --device cpu
      - name: Zip
        run: 7z a -tzip -mx=5 deck-narrator-windows-x64.zip .\dist\deck-narrator
      - uses: actions/upload-artifact@v4
        with:
          name: deck-narrator-windows-x64
          path: deck-narrator-windows-x64.zip
          retention-days: 14
      - name: Bundle the voice model (installer only)
        run: .\.venv\Scripts\python.exe packaging\fetch_model.py dist\deck-narrator\model
      - name: Build MSI (WiX)
        run: |
          $version = (.\.venv\Scripts\python.exe narrate.py --version).Split(" ")[1]
          "VERSION=$version" >> $env:GITHUB_ENV
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix build packaging\installer\DeckNarrator.wxs -arch x64 -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext `
            -d Version=$version -d AppDir="$PWD\dist\deck-narrator" -o deck-narrator-$version-x64.msi
          if ($LASTEXITCODE) { throw "wix build failed" }
          Get-Item deck-narrator-$version-x64.msi | Format-List Name, Length
      - name: Install MSI
        run: |
          $p = Start-Process msiexec.exe -ArgumentList "/i", "deck-narrator-$env:VERSION-x64.msi", "/qn", "INSTALLDEPS=1", "/l*v", "install.log" -Wait -PassThru
          if ($p.ExitCode) { Get-Content install.log -Tail 60; throw "install failed: $($p.ExitCode)" }
          $dir = "$env:ProgramFiles\Deck Narrator"
          foreach ($f in "deck-narrator.exe", "deck-narrator-gui.exe", "install-dependencies.cmd", "install-dependencies.ps1",
                      "ffmpeg\ffmpeg.exe", "model\kokoro-v1_0.pth", "model\voices\af_heart.pt") {
            if (-not (Test-Path "$dir\$f")) { throw "not installed: $f" }
          }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Deck Narrator.lnk")) { throw "no Start menu entry" }
          $path = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if (($path -split ";") -notcontains "$dir\") { throw "install folder not on system PATH: $path" }
          # INSTALLDEPS=1 ran the dependency script after the install; with LibreOffice
          # already here (installed above) it finds nothing to do.
          Select-String -Path install.log -Pattern "InstallDependencies" | Select-Object -First 3 | ForEach-Object { $_.Line }
      - name: Dependency script (installed)
        env:
          DECK_NARRATOR_NO_PAUSE: "1"
        run: |
          # (The copy INSTALLDEPS=1 started is still open, waiting for Enter: this one must cope.)
          $out = & "$env:ProgramFiles\Deck Narrator\install-dependencies.ps1" *>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE) { throw "install-dependencies.ps1 failed: $LASTEXITCODE" }
          if ($out -notmatch "Nothing to install") { throw "expected it to find LibreOffice already installed" }
      # An empty HuggingFace cache and offline mode: everything must come from the install.
      - name: Test suite (installed, offline)
        env:
          HF_HUB_OFFLINE: "1"
          HF_HOME: ${{ runner.temp }}\empty-hf
        run: |
          .\.venv\Scripts\python.exe test\verify.py --exe "$env:ProgramFiles\Deck Narrator\deck-narrator.exe" --device cpu
          if ($LASTEXITCODE) { throw "suite failed" }
          $line = & "$env:ProgramFiles\Deck Narrator\deck-narrator.exe" --update-voices
          if ($line -ne "voices: offline") { throw "offline voice check said: $line" }
      - name: Voice update check (installed, online)
        run: |
          $exe = "$env:ProgramFiles\Deck Narrator\deck-narrator.exe"
          $line = & $exe --update-voices
          Write-Host $line
          if ($line -ne "voices: 0 new; 0 updated") { throw "a just-built installer should have every current voice: $line" }
      - name: GUI (installed, offline)
        env:
          HF_HUB_OFFLINE: "1"
          HF_HOME: ${{ runner.temp }}\empty-hf
        run: |
          $gui = "$env:ProgramFiles\Deck Narrator\deck-narrator-gui.exe"
          Remove-Item test\test-deck.mp4 -ErrorAction SilentlyContinue
          .\test\gui_selftest.ps1 -Gui $gui -Mode builds -Deck test\anim-deck.pptx -Shot gui-builds.png
          .\test\gui_selftest.ps1 -Gui $gui -Mode sample -Deck test\anim-deck.pptx -Shot gui-sample.png
          .\test\gui_selftest.ps1 -Gui $gui -Mode video -Deck test\test-deck.pptx -Shot gui-video.png
      - name: Uninstall MSI
        run: |
          $p = Start-Process msiexec.exe -ArgumentList "/x", "deck-narrator-$env:VERSION-x64.msi", "/qn", "/l*v", "uninstall.log" -Wait -PassThru
          if ($p.ExitCode) { Get-Content uninstall.log -Tail 60; throw "uninstall failed: $($p.ExitCode)" }
          if (Test-Path "$env:ProgramFiles\Deck Narrator\deck-narrator.exe") { throw "files left behind" }
          if (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Deck Narrator.lnk") { throw "Start menu entry left behind" }
          $path = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if ($path -like "*Deck Narrator*") { throw "PATH entry left behind" }
      - uses: actions/upload-artifact@v4
        with:
          name: deck-narrator-msi
          path: deck-narrator-${{ env.VERSION }}-x64.msi
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-screenshots-and-logs
          path: |
            gui-*.png
            install.log
            uninstall.log
          if-no-files-found: ignore
          retention-days: 14
      # On a v* tag push, or a manual run with "release" ticked (which creates the tag).
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tag) { throw "tag ${{ github.ref_name }} doesn't match narrate.py VERSION $env:VERSION" }
          gh release create $tag deck-narrator-$env:VERSION-x64.msi deck-narrator-windows-x64.zip --target $env:GITHUB_SHA --title $tag --generate-notes
          if ($LASTEXITCODE) { throw "gh release create failed" }
