# Replaces a published release's notes with docs/release-notes/<tag>.md. Run it by hand
# after editing that file; new releases pick the file up on their own (see ci.yml).
name: release-notes
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.1"
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --notes-file "docs/release-notes/$TAG.md"
